# One-shot test entry for the Q6A fan DTB; see systems/gateway/fan/README.md.
# The kernel arguments must match /proc/cmdline of the normal entry.
menuentry 'Armbian, Linux 6.18.2-current-qcs6490, Q6A fan DTB test' --id q6a-fan-test {
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root e348da7d-fac8-4eda-9e4e-a252b87a2054
	linux	/boot/vmlinuz-6.18.2-current-qcs6490 root=UUID=e348da7d-fac8-4eda-9e4e-a252b87a2054 ro psi=1 ttyMSM0 console=tty0 console=ttyMSM0 splash plymouth.ignore-serial-consoles i915.force_probe=*
	initrd	/boot/initrd.img-6.18.2-current-qcs6490
	devicetree	/boot/armbian-dtb-6.18.2-current-qcs6490-fan
}
