# Permanent fallback: boot with the stock DTB if the fan DTB ever stops the
# board from booting. See systems/gateway/fan/README.md. Version-independent
# symlinks; the kernel arguments must match /proc/cmdline of the normal entry.
menuentry 'Armbian, newest kernel, stock DTB (Q6A fan fallback)' --id q6a-fan-fallback {
	insmod gzio
	insmod part_gpt
	insmod ext2
	search --no-floppy --fs-uuid --set=root e348da7d-fac8-4eda-9e4e-a252b87a2054
	linux	/boot/vmlinuz root=UUID=e348da7d-fac8-4eda-9e4e-a252b87a2054 ro psi=1 ttyMSM0 console=tty0 console=ttyMSM0 splash plymouth.ignore-serial-consoles i915.force_probe=*
	initrd	/boot/initrd.img
	devicetree	/boot/dtb/qcom/qcs6490-radxa-dragon-q6a.dtb
}

