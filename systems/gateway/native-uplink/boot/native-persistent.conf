[Unit]
Before=network-online.target
ConditionPathExists=
ConditionPathExists=|/run/printing-native-uplink/trial-permit
ConditionPathExists=|/var/lib/printing-station/rollback/native-uplink-trial/boot-enabled

ConditionPathExists=!/var/lib/printing-station/rollback/native-uplink-trial/boot-fallback
ConditionPathExists=!/var/lib/printing-station/rollback/native-uplink-trial/pending

[Service]
ExecStartPre=/usr/bin/python3 -IB /usr/local/libexec/printing-station/uplink-boot.py ready
TimeoutStartSec=70s

[Install]
WantedBy=multi-user.target
