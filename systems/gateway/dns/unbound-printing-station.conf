# Printer-LAN resolver: DNS-over-TLS to Control D p2 through tun0.
# Replaces /etc/unbound/unbound.conf.d/controld-dot.conf (port 53, one upstream).
server:
    # Not port 53: Windscribe's ctrld takes 127.0.0.1:53 if its Custom DNS is ever re-enabled.
    interface: 127.0.0.1@5335
    do-ip6: no
    # Control D validates DNSSEC; local validation would turn p2's 0.0.0.0 blocks
    # for signed domains into SERVFAIL. Overrides the packaged trust-anchor include.
    module-config: "iterator"
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"
    prefetch: yes
    # Answer from cache when the upstream is unreachable during a tunnel reconnect.
    serve-expired: yes
    serve-expired-ttl: 3600
    serve-expired-client-timeout: 1800
    # Without these, a query while tun0 is down marks Control D dead for 15 minutes.
    infra-keep-probing: yes
    infra-host-ttl: 60

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: no
    forward-addr: 76.76.2.11@853#p2.freedns.controld.com
    forward-addr: 76.76.10.11@853#p2.freedns.controld.com
